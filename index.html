<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Blank Log™ — Premium AI Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-card: #111111;
            --bg-hover: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --text-muted: #888888;
            --border-color: #222222;
            --shadow: none;
        }

        .light-mode {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-hover: #eeeeee;
            --text-primary: #111111;
            --text-secondary: #222222;
            --text-muted: #666666;
            --border-color: #e0e0e0;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-secondary);
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease-out; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .card:hover {
            border-color: #444;
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }
        .btn-primary:hover { opacity: 0.8; transform: scale(1.02); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover { opacity: 0.8; }

        input, select, textarea {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-secondary);
            width: 100%;
            transition: all 0.2s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--text-primary);
        }
        input::placeholder, textarea::placeholder { color: var(--text-muted); }

        .progress-bar {
            height: 4px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--text-primary);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .badge-free { background: rgba(255,255,255,0.08); color: #888; padding: 4px 10px; border-radius: 20px; font-size: 11px; }
        .badge-premium { background: rgba(255,255,255,0.15); color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 11px; }
        .badge-pro { background: #fff; color: #000; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }

        .badge-proof {
            background: #22c55e;
            color: #000;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .mobile-nav { display: flex; }
            .main-content { padding-bottom: 80px; }
        }
        @media (min-width: 769px) {
            .sidebar { display: flex; }
            .mobile-nav { display: none; }
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100%;
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            flex-direction: column;
            z-index: 40;
            overflow-y: auto;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .mobile-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 8px;
            z-index: 50;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .mobile-nav button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            padding: 8px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .mobile-nav button.active { color: var(--text-primary); }

        .main-content {
            margin-left: 260px;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease;
        }
        @media (max-width: 768px) {
            .main-content { margin-left: 0; padding: 16px; }
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 8px;
            color: var(--text-muted);
            transition: all 0.2s;
            cursor: pointer;
            background: none;
            border: none;
            width: 100%;
            font-size: 14px;
            font-weight: 500;
        }
        .nav-link:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .nav-link.active {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .footer {
            text-align: center;
            padding: 24px 20px;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }

        .proof-feed-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px;
            background: var(--bg-primary);
            border-radius: 8px;
            border-left: 3px solid #22c55e;
        }

        .proof-feed-item .name {
            font-weight: 600;
            color: var(--text-primary);
        }
        .proof-feed-item .amount {
            color: #22c55e;
            font-weight: 600;
        }
        .proof-feed-item .time {
            color: var(--text-muted);
            font-size: 12px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
            padding: 24px;
            width: 100%;
            max-width: 500px;
        }

        .profile-pic {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--bg-hover);
            border: 2px solid var(--border-color);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: var(--text-muted);
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .banner {
            width: 100%;
            height: 120px;
            background: var(--bg-hover);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .grid-3 { grid-template-columns: 1fr; }
            .grid-4 { grid-template-columns: 1fr 1fr; }
        }

        .theme-option {
            padding: 12px 20px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--bg-primary);
            color: var(--text-secondary);
        }
        .theme-option.active {
            border-color: var(--text-primary);
            background: var(--bg-hover);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // ============================================================
        // BLANK LOG — FINAL FRONTEND
        // ============================================================

        // ============================================================
        // PLANS
        // ============================================================
        const PLANS = {
            free: {
                id: 'free',
                name: 'Free',
                price: 0,
                priceDisplay: '$0',
                priceLabel: 'Free',
                limits: { autoPost: 5, chat: 20, kalshi: 5, code: 15 },
                badge: 'Free'
            },
            premium: {
                id: 'premium',
                name: 'Premium',
                price: 10,
                priceDisplay: '$10',
                priceLabel: '$10 / month',
                limits: { autoPost: 25, chat: 100, kalshi: 25, code: 75 },
                badge: 'Popular'
            },
            pro: {
                id: 'pro',
                name: 'Pro',
                price: 25,
                priceDisplay: '$25',
                priceLabel: '$25 / month',
                limits: { autoPost: Infinity, chat: Infinity, kalshi: Infinity, code: Infinity },
                badge: 'Best Value',
                unlimited: true
            }
        };

        // ============================================================
        // APP STATE
        // ============================================================
        let AppState = {
            isAuthenticated: true,
            currentUser: {
                id: 'user_001',
                name: 'Demo User',
                email: 'demo@blanklog.com',
                username: '@demo',
                bio: '',
                status: '🔨 Building the future',
                plan: 'free',
                role: 'user',
                pfp: null,
                banner: null,
                theme: 'dark'
            },
            activeTab: 'home',
            usage: {
                autoPost: { used: 0, limit: 5 },
                chat: { used: 0, limit: 20 },
                kalshi: { used: 0, limit: 5 },
                code: { used: 0, limit: 15 }
            },
            scheduledPosts: [],
            chatMessages: [],
            predictions: [],
            codeHistory: [],
            proofs: [],
            settings: {
                theme: 'dark'
            }
        };

        // ============================================================
        // STORAGE
        // ============================================================
        function saveState() {
            try {
                localStorage.setItem('blanklog_state', JSON.stringify({
                    usage: AppState.usage,
                    scheduledPosts: AppState.scheduledPosts,
                    chatMessages: AppState.chatMessages,
                    predictions: AppState.predictions,
                    codeHistory: AppState.codeHistory,
                    proofs: AppState.proofs,
                    currentUser: AppState.currentUser,
                    settings: AppState.settings
                }));
            } catch (e) {}
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('blanklog_state');
                if (saved) {
                    const data = JSON.parse(saved);
                    AppState.usage = data.usage || AppState.usage;
                    AppState.scheduledPosts = data.scheduledPosts || AppState.scheduledPosts;
                    AppState.chatMessages = data.chatMessages || AppState.chatMessages;
                    AppState.predictions = data.predictions || AppState.predictions;
                    AppState.codeHistory = data.codeHistory || AppState.codeHistory;
                    AppState.proofs = data.proofs || AppState.proofs;
                    if (data.currentUser) AppState.currentUser = { ...AppState.currentUser, ...data.currentUser };
                    if (data.settings) AppState.settings = data.settings;
                }
            } catch (e) {}
        }

        loadState();

        // ============================================================
        // THEME
        // ============================================================
        function applyTheme(theme) {
            if (theme === 'light') {
                document.body.classList.add('light-mode');
            } else {
                document.body.classList.remove('light-mode');
            }
            AppState.settings.theme = theme;
            saveState();
        }

        applyTheme(AppState.settings.theme || 'dark');

        // ============================================================
        // USAGE HELPERS
        // ============================================================
        function getRemaining(module) {
            const limit = AppState.usage[module].limit;
            const used = AppState.usage[module].used;
            return Math.max(0, limit - used);
        }

        function getPercent(module) {
            const limit = AppState.usage[module].limit;
            const used = AppState.usage[module].used;
            if (limit === Infinity) return 0;
            if (limit === 0) return 0;
            return (used / limit) * 100;
        }

        function getLimitDisplay(module) {
            const limit = AppState.usage[module].limit;
            if (limit === Infinity) return 'Unlimited';
            return limit;
        }

        function isUnlimited(module) {
            return AppState.usage[module].limit === Infinity;
        }

        function getPlanBadge() {
            const plan = AppState.currentUser.plan;
            if (plan === 'free') return 'badge-free';
            if (plan === 'premium') return 'badge-premium';
            return 'badge-pro';
        }

        // ============================================================
        // NAVIGATION
        // ============================================================
        const tabs = [
            { id: 'home', label: 'Home' },
            { id: 'autopost', label: 'Auto Post' },
            { id: 'chat', label: 'AI Chat' },
            { id: 'kalshi', label: 'Kalshi' },
            { id: 'code', label: 'Code' },
            { id: 'settings', label: '⚙️ Settings' }
        ];

        if (AppState.currentUser.role === 'admin' || AppState.currentUser.role === 'developer') {
            tabs.push({ id: 'admin', label: 'Admin' });
        }

        function setActiveTab(tabId) {
            AppState.activeTab = tabId;
            renderApp();
        }

        // ============================================================
        // SIDEBAR
        // ============================================================
        function renderSidebar() {
            const plan = AppState.currentUser.plan;
            const planData = PLANS[plan];

            return `
                <div class="sidebar">
                    <div class="p-6 border-b border-[var(--border-color)]">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-white text-black flex items-center justify-center">
                                <span class="text-xl font-black">◼</span>
                            </div>
                            <div>
                                <h1 class="text-xl font-bold text-[var(--text-primary)]">Blank Log</h1>
                                <p class="text-xs text-[var(--text-muted)]">v3.0.0</p>
                            </div>
                        </div>
                    </div>

                    <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
                        ${tabs.map(tab => `
                            <button onclick="setActiveTab('${tab.id}')" 
                                class="nav-link ${AppState.activeTab === tab.id ? 'active' : ''}">
                                ${tab.label}
                            </button>
                        `).join('')}
                    </nav>

                    <div class="p-4 border-t border-[var(--border-color)] space-y-3">
                        <div class="bg-[var(--bg-hover)] rounded-xl p-4 border border-[var(--border-color)]">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-sm font-medium text-[var(--text-primary)]">${planData.name} Plan</span>
                                <span class="${getPlanBadge()}">${planData.badge}</span>
                            </div>
                            <div class="text-2xl font-bold text-[var(--text-primary)]">${planData.priceLabel}</div>

                            <div class="mt-3">
                                <div class="flex justify-between text-xs text-[var(--text-muted)] mb-1">
                                    <span>Used this month</span>
                                    <span>${AppState.usage.autoPost.used}/${getLimitDisplay('autoPost')}</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${Math.min(100, getPercent('autoPost'))}%"></div>
                                </div>
                            </div>

                            ${plan === 'free' ? `
                                <button onclick="showPlansModal()" class="w-full mt-3 btn-primary text-sm py-2">Upgrade</button>
                            ` : plan === 'premium' ? `
                                <button onclick="showPlansModal()" class="w-full mt-3 btn-secondary text-sm py-2">Upgrade to Pro</button>
                            ` : `
                                <div class="w-full mt-3 text-center text-xs text-[var(--text-muted)]">Unlimited access</div>
                            `}
                        </div>

                        <div class="flex items-center gap-2 text-xs text-[var(--text-muted)]">
                            <div class="w-2 h-2 rounded-full bg-green-500"></div>
                            <span>System Online</span>
                            <span class="flex-1 text-right">${AppState.currentUser.name}</span>
                        </div>

                        <div class="flex items-center gap-2 text-xs text-[var(--text-muted)]">
                            <span>${AppState.currentUser.email}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // MOBILE NAV
        // ============================================================
        function renderMobileNav() {
            return `
                <div class="mobile-nav">
                    ${tabs.map(tab => `
                        <button onclick="setActiveTab('${tab.id}')" 
                            class="${AppState.activeTab === tab.id ? 'active' : ''}">
                            ${tab.label}
                        </button>
                    `).join('')}
                </div>
            `;
        }

        // ============================================================
        // FOOTER
        // ============================================================
        function renderFooter() {
            return `
                <div class="footer">
                    <p>© 2026 Blank Log &bull; blanklogapp@gmail.com &bull; All rights reserved.</p>
                </div>
            `;
        }

        // ============================================================
        // PROOF FEED COMPONENT
        // ============================================================
        function renderProofFeed() {
            const proofs = AppState.proofs.slice(0, 5);
            return `
                <div class="card p-5 mt-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-semibold text-[var(--text-primary)]">📉 Proof Feed — Live</h3>
                        <span class="text-xs text-[var(--text-muted)]">✔️ verified by Proof</span>
                    </div>
                    <div class="space-y-3">
                        ${proofs.map(p => `
                            <div class="proof-feed-item">
                                <div>
                                    <span class="name">${p.name}</span>
                                    <span class="text-[var(--text-muted)] text-sm"> from ${p.location}</span>
                                </div>
                                <div>
                                    <span class="amount">Won $${p.amount.toLocaleString()}</span>
                                    <span class="text-[var(--text-secondary)] text-sm"> on their bet</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="time">${p.time}</span>
                                    <span class="badge-proof">✔️ verified by Proof</span>
                                </div>
                            </div>
                        `).join('')}
                        ${proofs.length === 0 ? '<p class="text-[var(--text-muted)] text-sm">No proofs yet. Be the first!</p>' : ''}
                    </div>
                    ${proofs.length > 0 ? `
                        <button class="mt-3 text-sm text-[var(--text-primary)] hover:underline">View All Proofs →</button>
                    ` : ''}
                </div>
            `;
        }

        // ============================================================
        // HOME TAB
        // ============================================================
        function renderHomeTab() {
            const plan = AppState.currentUser.plan;
            const planData = PLANS[plan];

            const modules = [
                { id: 'autoPost', label: 'AutoPost' },
                { id: 'chat', label: 'AI Chat' },
                { id: 'kalshi', label: 'Kalshi' },
                { id: 'code', label: 'Code' }
            ];

            const usageCards = modules.map(m => {
                const remaining = getRemaining(m.id);
                const percent = getPercent(m.id);
                const limit = getLimitDisplay(m.id);
                const used = AppState.usage[m.id].used;
                const unlimited = isUnlimited(m.id);

                return `
                    <div class="card p-4">
                        <div class="flex items-center justify-between mb-3">
                            <span class="font-medium text-[var(--text-primary)]">${m.label}</span>
                            <span class="text-xs ${remaining === 0 && !unlimited ? 'text-red-400' : 'text-[var(--text-muted)]'}">
                                ${unlimited ? 'Unlimited' : remaining} left
                            </span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${unlimited ? 0 : Math.min(100, percent)}%"></div>
                        </div>
                        <div class="flex justify-between text-xs text-[var(--text-muted)] mt-2">
                            <span>${unlimited ? 'Unlimited' : used + ' / ' + limit}</span>
                            ${remaining === 0 && !unlimited ? '<span class="text-red-400">Upgrade for more</span>' : ''}
                        </div>
                    </div>
                `;
            }).join('');

            const recentPosts = AppState.scheduledPosts.slice(0, 3).map(post => `
                <div class="flex justify-between items-center p-2 bg-[var(--bg-primary)] rounded-lg">
                    <div>
                        <p class="text-sm text-[var(--text-primary)]">${post.title}</p>
                        <p class="text-xs text-[var(--text-muted)]">${post.platform} • ${new Date(post.scheduledTime).toLocaleString()}</p>
                    </div>
                    <span class="badge-free text-xs">Scheduled</span>
                </div>
            `).join('');

            return `
                <div class="fade-in">
                    <div class="mb-6">
                        <h1 class="text-3xl font-bold text-[var(--text-primary)]">Dashboard</h1>
                        <p class="text-[var(--text-muted)] mt-1">Welcome back, ${AppState.currentUser.name}</p>
                        <div class="mt-2">
                            <span class="${getPlanBadge()}">${planData.name} Plan</span>
                            ${plan === 'free' ? '<span class="text-xs text-[var(--text-muted)] ml-2">— Upgrade to unlock more</span>' : ''}
                            ${plan === 'premium' ? '<span class="text-xs text-[var(--text-muted)] ml-2">— 5x more than Free</span>' : ''}
                            ${plan === 'pro' ? '<span class="text-xs text-[var(--text-muted)] ml-2">— Unlimited access</span>' : ''}
                        </div>
                    </div>

                    <div class="grid-4 mb-6">
                        ${usageCards}
                    </div>

                    <div class="grid-2">
                        <div class="card p-5">
                            <h3 class="font-semibold text-[var(--text-primary)] mb-4">Quick Actions</h3>
                            <div class="grid-2 gap-2">
                                <button onclick="setActiveTab('autopost')" class="btn-secondary text-sm py-3">New Post</button>
                                <button onclick="setActiveTab('chat')" class="btn-secondary text-sm py-3">Chat</button>
                                <button onclick="setActiveTab('kalshi')" class="btn-secondary text-sm py-3">Predict</button>
                                <button onclick="setActiveTab('code')" class="btn-secondary text-sm py-3">Code</button>
                            </div>
                        </div>

                        <div class="card p-5">
                            <h3 class="font-semibold text-[var(--text-primary)] mb-4">Upcoming Posts</h3>
                            <div class="space-y-2">
                                ${recentPosts || '<div class="text-center text-[var(--text-muted)] py-8">No scheduled posts</div>'}
                            </div>
                        </div>
                    </div>

                    ${renderProofFeed()}
                    ${renderFooter()}
                </div>
            `;
        }

        // ============================================================
        // SETTINGS TAB
        // ============================================================
        function renderSettingsTab() {
            const user = AppState.currentUser;
            const theme = AppState.settings.theme || 'dark';

            return `
                <div class="fade-in max-w-3xl mx-auto">
                    <h1 class="text-3xl font-bold text-[var(--text-primary)] mb-6">⚙️ Settings</h1>

                    <!-- Profile Section -->
                    <div class="card p-5 mb-6">
                        <h3 class="font-semibold text-[var(--text-primary)] mb-4">Profile</h3>

                        <!-- Banner -->
                        <div class="banner relative">
                            ${user.banner ? `<img src="${user.banner}" alt="Banner">` : '<div class="flex items-center justify-center text-[var(--text-muted)]">Upload Banner</div>'}
                            <button class="absolute bottom-2 right-2 btn-secondary text-xs py-1 px-3" onclick="document.getElementById('bannerUpload').click()">Change Banner</button>
                            <input type="file" id="bannerUpload" accept="image/*" class="hidden" onchange="handleBannerUpload(this)">
                        </div>

                        <!-- Profile Picture -->
                        <div class="flex items-center gap-4 -mt-10 mb-4 relative z-10">
                            <div class="profile-pic">
                                ${user.pfp ? `<img src="${user.pfp}" alt="Profile">` : '👤'}
                            </div>
                            <button class="btn-secondary text-xs py-1 px-3" onclick="document.getElementById('pfpUpload').click()">Change Photo</button>
                            <input type="file" id="pfpUpload" accept="image/*" class="hidden" onchange="handlePfpUpload(this)">
                        </div>

                        <!-- Profile Fields -->
                        <div class="grid-2 mt-4">
                            <div>
                                <label class="text-xs text-[var(--text-muted)] block mb-1">Username</label>
                                <input type="text" id="settingsUsername" value="${user.username}" class="text-sm">
                            </div>
                            <div>
                                <label class="text-xs text-[var(--text-muted)] block mb-1">Status</label>
                                <input type="text" id="settingsStatus" value="${user.status}" class="text-sm" placeholder="What's on your mind?">
                            </div>
                        </div>

                        <div class="mt-3">
                            <label class="text-xs text-[var(--text-muted)] block mb-1">Bio</label>
                            <textarea id="settingsBio" rows="2" class="text-sm resize-none">${user.bio}</textarea>
                        </div>

                        <button onclick="saveProfileSettings()" class="mt-3 btn-primary text-sm py-2 px-4">Save Profile</button>
                    </div>

                    <!-- Appearance Section -->
                    <div class="card p-5 mb-6">
                        <h3 class="font-semibold text-[var(--text-primary)] mb-4">Appearance</h3>

                        <div class="flex gap-3">
                            <div class="theme-option ${theme === 'dark' ? 'active' : ''}" onclick="setTheme('dark')">
                                ⚫️ Dark
                            </div>
                            <div class="theme-option ${theme === 'light' ? 'active' : ''}" onclick="setTheme('light')">
                                💡 Light
                            </div>
                            <div class="theme-option ${theme === 'system' ? 'active' : ''}" onclick="setTheme('system')">
                                💻 System
                            </div>
                        </div>
                    </div>

                    <!-- Account Section -->
                    <div class="card p-5 mb-6">
                        <h3 class="font-semibold text-[var(--text-primary)] mb-4">Account</h3>

                        <div class="space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="text-sm text-[var(--text-secondary)]">Email</span>
                                <span class="text-sm text-[var(--text-primary)]">${user.email}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-sm text-[var(--text-secondary)]">Plan</span>
                                <span class="text-sm text-[var(--text-primary)]">${PLANS[user.plan].name}</span>
                            </div>
                            <button onclick="showPlansModal()" class="btn-secondary text-sm py-2 w-full">Manage Plan</button>
                            <button class="text-red-400 text-sm hover:text-red-300">Delete Account</button>
                        </div>
                    </div>

                    ${renderFooter()}
                </div>
            `;
        }

        // ============================================================
        // SETTINGS FUNCTIONS
        // ============================================================
        function handlePfpUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    AppState.currentUser.pfp = e.target.result;
                    saveState();
                    renderApp();
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function handleBannerUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    AppState.currentUser.banner = e.target.result;
                    saveState();
                    renderApp();
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function saveProfileSettings() {
            const username = document.getElementById('settingsUsername')?.value;
            const status = document.getElementById('settingsStatus')?.value;
            const bio = document.getElementById('settingsBio')?.value;

            if (username) AppState.currentUser.username = username;
            if (status !== undefined) AppState.currentUser.status = status;
            if (bio !== undefined) AppState.currentUser.bio = bio;

            saveState();
            renderApp();
            showToast('Profile updated!');
        }

        function setTheme(theme) {
            AppState.settings.theme = theme;
            if (theme === 'system') {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(prefersDark ? 'dark' : 'light');
            } else {
                applyTheme(theme);
            }
            saveState();
            renderApp();
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-20 right-4 bg-white text-black px-4 py-2 rounded-lg shadow-lg fade-in z-50';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // ============================================================
        // RENDER APP
        // ============================================================
        function renderApp() {
            if (!AppState.isAuthenticated) {
                document.getElementById('root').innerHTML = `
                    <div class="min-h-screen flex items-center justify-center bg-[var(--bg-primary)]">
                        <div class="max-w-md w-full p-6">
                            <div class="text-center mb-8">
                                <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center mx-auto mb-4">
                                    <span class="text-2xl font-black text-black">◼</span>
                                </div>
                                <h1 class="text-3xl font-bold text-[var(--text-primary)]">Blank Log</h1>
                                <p class="text-[var(--text-muted)] mt-2">Sign in to continue</p>
                            </div>
                            <div class="bg-[var(--bg-secondary)] rounded-xl p-6 border border-[var(--border-color)]">
                                <input type="email" placeholder="Email" class="mb-3" value="demo@blanklog.com">
                                <input type="password" placeholder="Password" class="mb-4" value="password">
                                <button onclick="login()" class="w-full btn-primary py-2">Sign In</button>
                                <p class="text-center text-xs text-[var(--text-muted)] mt-4">Demo: any email / any password</p>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            let content = '';
            switch (AppState.activeTab) {
                case 'home':
                    content = renderHomeTab();
                    break;
                case 'autopost':
                    content = renderAutoPostTab();
                    break;
                case 'chat':
                    content = renderChatTab();
                    break;
                case 'kalshi':
                    content = renderKalshiTab();
                    break;
                case 'code':
                    content = renderCodeTab();
                    break;
                case 'settings':
                    content = renderSettingsTab();
                    break;
                case 'admin':
                    content = renderAdminTab();
                    break;
                default:
                    content = renderHomeTab();
            }

            document.getElementById('root').innerHTML = `
                <div class="flex">
                    ${renderSidebar()}
                    <div class="main-content">
                        ${content}
                    </div>
                    ${renderMobileNav()}
                </div>
            `;
        }

        // ============================================================
        // LOGIN FUNCTION
        // ============================================================
        function login() {
            AppState.isAuthenticated = true;
            renderApp();
        }

        // ============================================================
        // PLACEHOLDER FUNCTIONS FOR OTHER TABS
        // ============================================================
        function renderAutoPostTab() {
            return `
                <div class="fade-in">
                    <h1 class="text-3xl font-bold text-[var(--text-primary)] mb-2">Auto Post</h1>
                    <p class="text-[var(--text-muted)] mb-6">Schedule posts to TikTok, YouTube, and Instagram</p>
                    <div class="card p-5 text-center py-12">
                        <p class="text-[var(--text-muted)]">Auto Post tab content goes here</p>
                        <p class="text-sm text-[var(--text-muted)] mt-2">Backend integration coming soon</p>
                    </div>
                    ${renderFooter()}
                </div>
            `;
        }

        function renderChatTab() {
            return `
                <div class="fade-in">
                    <h1 class="text-3xl font-bold text-[var(--text-primary)] mb-2">AI Chat</h1>
                    <p class="text-[var(--text-muted)] mb-6">Ask me anything</p>
                    <div class="card p-5 text-center py-12">
                        <p class="text-[var(--text-muted)]">AI Chat tab content goes here</p>
                        <p class="text-sm text-[var(--text-muted)] mt-2">Backend integration coming soon</p>
                    </div>
                    ${renderFooter()}
                </div>
            `;
        }

        function renderKalshiTab() {
            return `
                <div class="fade-in">
                    <h1 class="text-3xl font-bold text-[var(--text-primary)] mb-2">Kalshi</h1>
                    <p class="text-[var(--text-muted)] mb-6">Upload a screenshot, AI does deep research, tells you Yes or No</p>
                    <div class="card p-5 text-center py-12">
                        <p class="text-[var(--text-muted)]">Kalshi tab content goes here</p>
                        <p class="text-sm text-[var(--text-muted)] mt-2">Backend integration coming soon</p>
                    </div>
                    ${renderFooter()}
                </div>
            `;
        }

        function renderCodeTab() {
            return `
                <div class="fade-in">
                    <h1 class="text-3xl font-bold text-[var(--text-primary)] mb-2">Code Assistant</h1>
                    <p class="text-[var(--text-muted)] mb-6">AI-powered code analysis and debugging</p>
                    <div class="card p-5 text-center py-12">
                        <p class="text-[var(--text-muted)]">Code Assistant tab content goes here</p>
                        <p class="text-sm text-[var(--text-muted)] mt-2">Backend integration coming soon</p>
                    </div>
                    ${renderFooter()}
                </div>
            `;
        }

        function renderAdminTab() {
            const isAdmin = AppState.currentUser.role === 'admin' || AppState.currentUser.role === 'developer';
            if (!isAdmin) {
                return `
                    <div class="p-12 text-center">
                        <div class="text-6xl mb-4">🔒</div>
                        <h2 class="text-2xl font-bold text-[var(--text-primary)]">Access Denied</h2>
                        <p class="text-[var(--text-muted)] mt-2">Admin access only</p>
                    </div>
                `;
            }

            return `
                <div class="fade-in">
                    <h1 class="text-3xl font-bold text-[var(--text-primary)] mb-2">Admin Panel</h1>
                    <p class="text-[var(--text-muted)] mb-6">System administration and controls</p>
                    <div class="card p-5 text-center py-12">
                        <p class="text-[var(--text-muted)]">Admin panel content goes here</p>
                        <p class="text-sm text-[var(--text-muted)] mt-2">Backend integration coming soon</p>
                    </div>
                    ${renderFooter()}
                </div>
            `;
        }

        function showPlansModal() {
            alert('Plans: Free, Premium ($10/mo), Pro ($25/mo)');
        }

        // ============================================================
        // INITIALIZE
        // ============================================================
        renderApp();

        // Make functions global
        window.setActiveTab = setActiveTab;
        window.handlePfpUpload = handlePfpUpload;
        window.handleBannerUpload = handleBannerUpload;
        window.saveProfileSettings = saveProfileSettings;
        window.setTheme = setTheme;
        window.showPlansModal = showPlansModal;
        window.login = login;
    </script>
</body>
</html>
